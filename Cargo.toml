[workspace]
members = [".", "crates/danso-ops", "crates/danso-runtime"]

[package]
name = "danso"
version = "0.1.0"
edition = "2024"
description = "A headless worker harness with Pi portable contracts"
license = "MIT"

# Optional modules from docs/unified-design.md §3.1. Both are declared now
# so a CLI-only build (`--no-default-features`) is a supported configuration
# from the start; the module crates land behind them in later stages.
[features]
default = ["ops"]
# `ops` gates the `danso service` CLI surface only. The `danso-ops` crate
# itself is an unconditional dependency: it owns the `health.json` schema, and
# the Telegram loop that writes that file is compiled in every configuration.
# Making the dependency optional would fork the schema between builds, which is
# worse than carrying a small, dependency-light crate in a CLI-only build.
ops = []
telegram = []

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
danso-ops = { path = "crates/danso-ops" }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
serde_norway = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
