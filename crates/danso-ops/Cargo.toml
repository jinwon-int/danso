[package]
name = "danso-ops"
version = "0.1.0"
edition = "2024"
description = "Resident-service operations primitives for Danso: pid bookkeeping, process probes and three-state status"
license = "MIT"

# This crate is deliberately free of any `danso` dependency. The root package
# owns the CLI and the Telegram loop and pulls these primitives in behind the
# `ops` feature; a dependency edge in the other direction would be a cycle.
[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
