[package]
name = "danso-wiki"
version = "0.1.0"
edition = "2024"
description = "Read-only wiki-agent index reader for Danso: meta/manifest/chunks, a local pre-parsed query cache and status reporting"
license = "MIT"

# Charter (issue #121, PR slice 1): parse the wiki-agent index files as they
# are on disk and maintain a local query cache. This crate never builds an
# index, never writes into the synced wiki cache, and never touches the
# network — the read path must not grow a write path by accident. Dependencies
# stay in the same spirit: serde for the on-disk formats, bincode for the
# local cache only.
[dependencies]
anyhow = "1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
