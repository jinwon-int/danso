[package]
name = "danso-wiki"
version = "0.1.0"
edition = "2024"
description = "Read-only wiki-agent index reader for Danso: meta/manifest/chunks, a local pre-parsed query cache and status reporting"
license = "MIT"

# Charter (issue #121, PR slice 1): parse the wiki-agent index files as they
# are on disk and maintain a local query cache. This crate never builds an
# index, never writes into the synced wiki cache, and never touches the
# network — the read path must not grow a write path by accident. Slice 2
# (#121) adds the `find` query port, which needs the same algorithms the bash
# implementation runs: `regex` for the shared tokenizer/masking rules,
# `blake2b` (4-byte digest) for the hashed-v3-d2048 sparse vectorizer so a
# query embeds bit-identically across runtimes, `sha2` for the jina query
# embedding cache key, and `libc` for the RSS metric the bash output carries.
# All of it is local computation; nothing here dials out.
[dependencies]
anyhow = "1"
bincode = "1.3"
blake2 = "0.11"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
