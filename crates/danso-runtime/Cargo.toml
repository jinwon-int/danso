[package]
name = "danso-runtime"
version = "0.1.0"
edition = "2024"
description = "Provider-neutral agent session contract and in-process turn runner for Danso embedders"
license = "MIT"

[dependencies]
anyhow = "1"
danso = { path = "../.." }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
