name: CodeQL

# Restores CodeQL after GHAS default setup was switched off on 2026-09-19
# (danso#141). Default setup cannot take a config file; this workflow can, so
# future false positives get a documented exclusion instead of a global off.
# merge_group is required: main runs a merge queue, and a required check that
# never reports on the group would block every enqueued PR.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "23 4 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
