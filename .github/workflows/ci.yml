name: Rust contracts
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    # jammy: image_decode_process bubblewrap contracts fail on noble (24.04)
    # in this PR (9 tests). minisign is not in jammy apt; pin the official
    # linux x86_64 binary instead of moving the whole job to 24.04.
    # release.yml stays on 22.04 for the glibc floor.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check merge queue workflow contract
        run: python3 scripts/test_merge_queue.py
      - name: Check release signing key and the signing workflows' contract
        run: python3 scripts/test_release_signing.py
      - name: Install toolchain and sandbox
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # minisign 0.12 linux tarball (jedisct1). sha256 pinned.
          curl -fsSL -o /tmp/minisign.tgz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tgz" | sha256sum -c
          tar -xzf /tmp/minisign.tgz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v
      - name: Format, lint and test
        run: |
          cargo +1.98.1 fmt --check
          # --workspace, not the root package: the root manifest is itself a
          # package, so an unqualified `clippy`/`test` silently skips every
          # `#[cfg(test)]` module in crates/*. That is how 114 unit tests --
          # including the self-update ordering invariant -- were never once run
          # by CI.
          cargo +1.98.1 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.1 test --locked --workspace
          cargo +1.98.1 build --locked
          # The CLI-only build is a supported configuration (Cargo.toml), and
          # nothing else here compiles it: a `crate::` path added under the
          # `ops` gate builds fine by default and breaks only this. Measured —
          # that is exactly how it broke once.
          cargo +1.98.1 check --locked --no-default-features
          cargo +1.98.1 build --release --locked
          python3 scripts/test_e2e.py
          # The documented install builds --release; run the CLI contract
          # against that artifact too. Release disables the overflow checks
          # and debug assertions every other suite runs with.
          DANSO_BIN=target/release/danso python3 scripts/test_e2e.py
          python3 scripts/test_memory.py
          python3 scripts/test_compaction.py
          python3 scripts/test_providers.py
          python3 scripts/test_live_acceptance.py
          python3 scripts/test_dev_check.py
          python3 scripts/test_worker_checks.py
          python3 scripts/test_dev_check_host.py
          python3 scripts/test_ccc_node.py
          python3 scripts/test_progress.py
          python3 scripts/test_harness_eval.py
          python3 scripts/test_eval_case.py
          python3 scripts/test_eval_dispatch.py
          python3 scripts/test_host_execution.py
          python3 scripts/test_chatgpt.py
          python3 scripts/test_chatgpt_refresh.py
