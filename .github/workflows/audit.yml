name: Supply chain
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  schedule:
    # New advisories land without a commit, so audit on a fixed weekly cadence.
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Informational advisories (unmaintained/unsound) are gate failures,
          # not notices: an unmaintained parser reached by untrusted skill
          # frontmatter is exactly the case this gate exists to catch.
          denyWarnings: true
