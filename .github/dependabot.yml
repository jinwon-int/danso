version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # bincode 1.3.3 stays: the 2.x major upgrade was intentionally abandoned
      # (see #197); ignore major bumps so dependabot does not recreate the PR.
      - dependency-name: "bincode"
        update-types:
          - version-update:semver-major
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
